[project]
name = "tao-diffusion"
version = "0.1.0"
description = "Policy Gradient Fine-Tuning of Diffusion Models with Timestep-Aware Optimization"
requires-python = ">=3.10"
dependencies = [
    # Core ML — install torch with the right CUDA variant first: https://pytorch.org/get-started/locally/
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "diffusers>=0.37.1",
    "transformers>=4.57.6",
    "accelerate>=1.13.0",
    # Reward models
    "image-reward>=1.5",
    "simple-aesthetics-predictor>=0.1.2",
    # Data & numerics
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "imageio>=2.30.0",
    # Image processing
    "Pillow>=10.0.0",
    # Experiment tracking
    "wandb>=0.26.0",
    # Utilities
    "tqdm>=4.65.0",
    # Notebook support
    "ipykernel>=6.0.0",
]

[tool.uv]
# Scripts-only repo — not an installable package
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
